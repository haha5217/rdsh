<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="乾安县发展党员时间合理性审核工具">
  <title>乾安县发展党员时间合理性审核工具</title>
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <style>
    :root {
      --red: #8d1f24;
      --red-deep: #68151a;
      --red-soft: #f8eceb;
      --gold: #b78a42;
      --ink: #25211e;
      --muted: #716961;
      --line: #ded7ce;
      --paper: #fffdf8;
      --ground: #f3efe8;
      --green: #2d6a4f;
      --green-soft: #e8f3ed;
      --amber: #936217;
      --amber-soft: #fff2d8;
      --danger: #a2252b;
      --danger-soft: #f8e4e4;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(183, 138, 66, .1), transparent 29rem),
        linear-gradient(180deg, #faf7f1 0, var(--ground) 100%);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .topbar {
      background: rgba(255, 253, 248, .94);
      border-bottom: 1px solid rgba(141, 31, 36, .12);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(920px, calc(100% - 32px));
      min-height: 74px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .site-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      border-radius: 12px 12px 12px 4px;
      box-shadow: 0 7px 18px rgba(104, 21, 26, .2);
    }

    h1 {
      margin: 0;
      font-family: SimHei, "Microsoft YaHei", sans-serif;
      font-size: 19px;
      font-weight: 400;
      letter-spacing: .02em;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 32px auto 56px;
    }

    .panel {
      background: rgba(255, 253, 248, .98);
      border: 1px solid rgba(103, 85, 68, .15);
      border-radius: 24px 24px 24px 8px;
      box-shadow: 0 20px 62px rgba(57, 43, 28, .09);
    }

    .form-panel { padding: 38px; }

    .section-title {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--line);
    }

    .section-title > span {
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 30px;
      line-height: 1;
    }

    .section-title h2 {
      margin: 0;
      font-family: SimHei, "Microsoft YaHei", sans-serif;
      font-size: 24px;
      font-weight: 400;
    }

    .section-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .questions {
      margin-top: 28px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .question {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .question.full { grid-column: 1 / -1; }
    .question-label { font-size: 14px; font-weight: 700; }
    .question-label em { margin-left: 5px; color: var(--red); font-size: 11px; font-style: normal; }

    .question input {
      width: 100%;
      min-height: 50px;
      padding: 0 14px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #d5cec5;
      border-radius: 11px;
      outline: none;
      transition: border .2s, box-shadow .2s;
    }

    .question input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(141,31,36,.1); }
    .question small { color: var(--muted); font-size: 11px; line-height: 1.55; }
    .error { color: var(--danger) !important; font-weight: 700; }

    .form-actions {
      margin-top: 30px;
      padding-top: 24px;
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--line);
    }

    .primary, .secondary {
      min-height: 48px;
      padding: 0 22px;
      border-radius: 11px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 800;
    }

    .primary { color: #fff; background: var(--red); box-shadow: 0 8px 22px rgba(141,31,36,.2); }
    .primary:hover { background: var(--red-deep); }
    .secondary { color: var(--ink); background: var(--paper); border-color: var(--line); }

    .result-panel { overflow: hidden; }
    .result-head {
      padding: 34px 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      color: #fff;
      background: var(--red-deep);
    }

    .result-head h2 {
      margin: 0;
      font-family: SimHei, "Microsoft YaHei", sans-serif;
      font-size: 27px;
      font-weight: 400;
    }

    .result-head p { margin: 7px 0 0; color: rgba(255,255,255,.68); font-size: 12px; }

    .verdict {
      min-width: 104px;
      padding: 12px 16px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(255,255,255,.1);
      font-size: 18px;
      font-weight: 800;
    }

    .result-body { padding: 30px 38px 38px; }
    .identity-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      overflow: hidden;
      background: var(--line);
      border: 1px solid var(--line);
      border-radius: 13px;
    }

    .identity-strip > div { padding: 16px; background: #faf7f1; }
    .identity-strip span, .check-card span { display: block; color: var(--muted); font-size: 10px; }
    .identity-strip strong { display: block; margin-top: 5px; font-size: 14px; }

    .checks { margin-top: 18px; display: grid; gap: 12px; }
    .check-card {
      padding: 19px 20px;
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 14px 14px 14px 5px;
      background: #fff;
    }

    .check-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 17px;
      font-weight: 900;
    }

    .check-card.pass .check-mark { color: var(--green); background: var(--green-soft); }
    .check-card.warn .check-mark { color: var(--amber); background: var(--amber-soft); }
    .check-card.fail .check-mark { color: var(--danger); background: var(--danger-soft); }
    .check-copy strong { display: block; margin-bottom: 5px; font-size: 15px; }
    .check-copy p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .check-status { padding: 6px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .pass .check-status { color: var(--green); background: var(--green-soft); }
    .warn .check-status { color: var(--amber); background: var(--amber-soft); }
    .fail .check-status { color: var(--danger); background: var(--danger-soft); }

    .result-actions { margin-top: 24px; display: flex; justify-content: flex-end; }

    @media (max-width: 680px) {
      .topbar-inner, main { width: min(100% - 20px, 920px); }
      .topbar-inner { min-height: 64px; }
      .site-icon { width: 39px; height: 39px; }
      h1 { font-size: 15px; }
      main { margin-top: 18px; }
      .form-panel { padding: 24px 18px; }
      .section-title h2 { font-size: 21px; }
      .questions { grid-template-columns: 1fr; }
      .question.full { grid-column: auto; }
      .question input { min-width: 0; }
      .form-actions .primary { width: 100%; }
      .result-head { padding: 25px 20px; align-items: flex-start; flex-direction: column; }
      .result-head h2 { font-size: 23px; }
      .verdict { min-width: 0; }
      .result-body { padding: 20px 16px 26px; }
      .identity-strip { grid-template-columns: 1fr; }
      .check-card { grid-template-columns: 34px 1fr; align-items: flex-start; }
      .check-status { grid-column: 2; justify-self: start; }
      .result-actions .secondary { width: 100%; }
    }

    @media (max-width: 390px) {
      h1 { font-size: 14px; line-height: 1.35; }
      .site-icon { width: 36px; height: 36px; }
      .form-panel { padding: 21px 14px; }
      .section-title { gap: 10px; }
      .section-title > span { font-size: 25px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <img class="site-icon" src="./icon.png" alt="">
      <h1>乾安县发展党员时间合理性审核工具</h1>
    </div>
  </header>

  <main>
    <section class="panel form-panel" id="formPanel">
      <div class="section-title">
        <span>01</span>
        <div>
          <h2>填写个人信息</h2>
          <p>请以党员档案记载日期为准。</p>
        </div>
      </div>

      <form id="reviewForm" novalidate>
        <div class="questions">
          <label class="question">
            <span class="question-label">姓名 <em>必填</em></span>
            <input id="name" maxlength="30" autocomplete="name" placeholder="请输入姓名">
            <small class="error" id="nameError" hidden></small>
          </label>

          <label class="question">
            <span class="question-label">身份证号 <em>必填</em></span>
            <input id="idCard" maxlength="18" inputmode="text" autocomplete="off" placeholder="请输入15位或18位身份证号">
            <small class="error" id="idError" hidden></small>
          </label>

          <label class="question">
            <span class="question-label">递交入党申请书日期 <em>必填</em></span>
            <input id="applicationDate" type="date">
            <small class="error" id="applicationError" hidden></small>
          </label>

          <label class="question">
            <span class="question-label">确定入党积极分子日期 <em>必填</em></span>
            <input id="activistDate" type="date">
            <small>申请至确定积极分子满6个月作为工作提示。</small>
            <small class="error" id="activistError" hidden></small>
          </label>

          <label class="question">
            <span class="question-label">接收为预备党员日期 <em>必填</em></span>
            <input id="joinDate" type="date">
            <small>以支部党员大会通过接收之日为准。</small>
            <small class="error" id="joinError" hidden></small>
          </label>

          <label class="question">
            <span class="question-label">转为正式党员日期 <em>必填</em></span>
            <input id="regularDate" type="date">
            <small>填写档案记载的转正日期。</small>
            <small class="error" id="regularError" hidden></small>
          </label>
        </div>

        <div class="form-actions">
          <button class="primary" type="submit">开始审核</button>
        </div>
      </form>
    </section>

    <section class="panel result-panel" id="resultPanel" hidden>
      <div class="result-head">
        <div>
          <h2 id="resultTitle"></h2>
          <p>依据录入信息生成的程序时间筛查结果</p>
        </div>
        <div class="verdict" id="verdict"></div>
      </div>

      <div class="result-body">
        <div class="identity-strip">
          <div><span>出生日期</span><strong id="birthValue"></strong></div>
          <div><span>接收时年龄</span><strong id="ageValue"></strong></div>
          <div><span>预备期时长</span><strong id="probationValue"></strong></div>
        </div>

        <div class="checks" id="checks"></div>

        <div class="result-actions">
          <button class="secondary" id="restartButton" type="button">重新审核</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('reviewForm');
    const formPanel = document.getElementById('formPanel');
    const resultPanel = document.getElementById('resultPanel');
    const fields = {
      name: document.getElementById('name'),
      idCard: document.getElementById('idCard'),
      applicationDate: document.getElementById('applicationDate'),
      activistDate: document.getElementById('activistDate'),
      joinDate: document.getElementById('joinDate'),
      regularDate: document.getElementById('regularDate')
    };

    function pad(value) { return String(value).padStart(2, '0'); }
    function formatDate(date) { return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`; }

    function parseDate(value) {
      if (!value) return null;
      const [year, month, day] = value.split('-').map(Number);
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date : null;
    }

    function addYears(date, years) {
      const result = new Date(date);
      const month = result.getMonth();
      result.setFullYear(result.getFullYear() + years);
      if (result.getMonth() !== month) result.setDate(0);
      return result;
    }

    function addMonths(date, months) {
      const result = new Date(date);
      const originalDay = result.getDate();
      result.setDate(1);
      result.setMonth(result.getMonth() + months);
      const lastDay = new Date(result.getFullYear(), result.getMonth() + 1, 0).getDate();
      result.setDate(Math.min(originalDay, lastDay));
      return result;
    }

    function daysBetween(start, end) {
      const startUtc = Date.UTC(start.getFullYear(), start.getMonth(), start.getDate());
      const endUtc = Date.UTC(end.getFullYear(), end.getMonth(), end.getDate());
      return Math.round((endUtc - startUtc) / 86400000);
    }

    function birthdayFromId(raw) {
      const value = raw.trim();
      if (/^\d{17}[\dXx]$/.test(value)) {
        const weights = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
        const checks = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
        const sum = value.slice(0, 17).split('').reduce((total, digit, index) => total + Number(digit) * weights[index], 0);
        if (checks[sum % 11] !== value.slice(17).toUpperCase()) return null;
        return validBirthday(Number(value.slice(6, 10)), Number(value.slice(10, 12)), Number(value.slice(12, 14)));
      }
      if (/^\d{15}$/.test(value)) {
        return validBirthday(Number(`19${value.slice(6, 8)}`), Number(value.slice(8, 10)), Number(value.slice(10, 12)));
      }
      return null;
    }

    function validBirthday(year, month, day) {
      const date = new Date(year, month - 1, day);
      return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? date : null;
    }

    function ageText(birth, at) {
      let years = at.getFullYear() - birth.getFullYear();
      let months = at.getMonth() - birth.getMonth();
      let days = at.getDate() - birth.getDate();
      if (days < 0) {
        months -= 1;
        days += new Date(at.getFullYear(), at.getMonth(), 0).getDate();
      }
      if (months < 0) { years -= 1; months += 12; }
      return `${years}岁${months}个月${days}天`;
    }

    function showError(id, message) {
      const target = document.getElementById(id);
      target.textContent = message;
      target.hidden = !message;
    }

    function validate() {
      const birth = birthdayFromId(fields.idCard.value);
      const application = parseDate(fields.applicationDate.value);
      const activist = parseDate(fields.activistDate.value);
      const join = parseDate(fields.joinDate.value);
      const regular = parseDate(fields.regularDate.value);
      showError('nameError', fields.name.value.trim() ? '' : '请填写姓名。');
      showError('idError', birth ? '' : '请输入有效的身份证号。');
      showError('applicationError', application ? '' : '请选择递交入党申请书日期。');
      showError('activistError', activist ? '' : '请选择确定入党积极分子日期。');
      showError('joinError', join ? '' : '请选择接收为预备党员日期。');
      showError('regularError', regular ? '' : '请选择转为正式党员日期。');
      return fields.name.value.trim() && birth && application && activist && join && regular
        ? { birth, application, activist, join, regular }
        : null;
    }

    function checkCard(level, title, detail, status) {
      const marks = { pass: '✓', warn: '!', fail: '×' };
      return `<article class="check-card ${level}"><div class="check-mark">${marks[level]}</div><div class="check-copy"><strong>${title}</strong><p>${detail}</p></div><span class="check-status">${status}</span></article>`;
    }

    function renderResult(data) {
      const age18 = addYears(data.birth, 18);
      const sixMonthPoint = addMonths(data.application, 6);
      const cultivationEnd = addYears(data.activist, 1);
      const expectedRegular = addYears(data.join, 1);
      const probationDays = daysBetween(data.join, data.regular);
      const cards = [];
      let failCount = 0;
      let warnCount = 0;

      if (data.application < age18) {
        failCount += 1;
        cards.push(checkCard('fail', '申请入党年龄', `递交申请书时尚未满18周岁；满18周岁日期为${formatDate(age18)}。`, '不合理'));
      } else {
        cards.push(checkCard('pass', '申请入党年龄', `递交申请书时为${ageText(data.birth, data.application)}。`, '符合'));
      }

      if (data.activist < data.application) {
        failCount += 1;
        cards.push(checkCard('fail', '申请至确定积极分子', '确定入党积极分子日期早于递交入党申请书日期。', '不合理'));
      } else if (data.activist < sixMonthPoint) {
        warnCount += 1;
        cards.push(checkCard('warn', '申请至确定积极分子', `间隔${daysBetween(data.application, data.activist)}天，未达到满6个月的提示口径。`, '需核实'));
      } else {
        cards.push(checkCard('pass', '申请至确定积极分子', `已达到满6个月的提示口径，满6个月日期为${formatDate(sixMonthPoint)}。`, '符合提示'));
      }

      if (data.join < cultivationEnd) {
        failCount += 1;
        cards.push(checkCard('fail', '积极分子培养考察', `未满一年；达到一年培养期限的日期为${formatDate(cultivationEnd)}。`, '不合理'));
      } else {
        cards.push(checkCard('pass', '积极分子培养考察', `从确定入党积极分子到接收为预备党员共${daysBetween(data.activist, data.join)}天。`, '符合'));
      }

      if (data.regular < data.join) {
        failCount += 1;
        cards.push(checkCard('fail', '转正时间', '转正日期早于接收为预备党员日期。', '不合理'));
      } else if (data.regular < expectedRegular) {
        failCount += 1;
        cards.push(checkCard('fail', '转正时间', `预备期不足一年，正常预备期满日为${formatDate(expectedRegular)}。`, '不合理'));
      } else if (data.regular > expectedRegular) {
        warnCount += 1;
        cards.push(checkCard('warn', '转正时间', `超过正常预备期满日${formatDate(expectedRegular)}，需核实延期转正或延长预备期材料。`, '需核实'));
      } else {
        cards.push(checkCard('pass', '转正时间', `转正日期与正常预备期满日${formatDate(expectedRegular)}一致。`, '符合'));
      }

      const verdict = failCount ? '不合理' : warnCount ? '需核实' : '合理';
      document.getElementById('resultTitle').textContent = `${fields.name.value.trim()}审核结果`;
      document.getElementById('verdict').textContent = verdict;
      document.getElementById('birthValue').textContent = formatDate(data.birth);
      document.getElementById('ageValue').textContent = ageText(data.birth, data.join);
      document.getElementById('probationValue').textContent = `${probationDays}天`;
      document.getElementById('checks').innerHTML = cards.join('');
      formPanel.hidden = true;
      resultPanel.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const data = validate();
      if (!data) return;
      try {
        localStorage.setItem('rdshSingleReview', JSON.stringify({
          name: fields.name.value.trim(),
          idCard: fields.idCard.value.trim(),
          applicationDate: fields.applicationDate.value,
          activistDate: fields.activistDate.value,
          joinDate: fields.joinDate.value,
          regularDate: fields.regularDate.value
        }));
      } catch (error) {}
      renderResult(data);
    });

    document.getElementById('restartButton').addEventListener('click', () => {
      resultPanel.hidden = true;
      formPanel.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    try {
      const saved = JSON.parse(localStorage.getItem('rdshSingleReview') || 'null');
      if (saved) Object.keys(fields).forEach(key => { if (saved[key]) fields[key].value = saved[key]; });
    } catch (error) {}
  </script>
</body>
</html>
